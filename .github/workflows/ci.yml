name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      # Las pruebas de integración levantan MySQL con Testcontainers
      # (Docker viene preinstalado en los runners de ubuntu-latest).
      - name: Pruebas
        run: dotnet test --no-build --configuration Release

      - name: Auditar dependencias vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Se encontraron dependencias con vulnerabilidades conocidas."
            exit 1
          fi
