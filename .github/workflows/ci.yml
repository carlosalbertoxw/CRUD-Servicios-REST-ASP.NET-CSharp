name: CI

on:
  push:
    branches: [master]
  pull_request:

# El token de GitHub solo necesita leer el código.
permissions:
  contents: read

# Un push nuevo sobre la misma rama deja obsoleto al run anterior; en master no
# se cancela para que cada commit integrado conserve su resultado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Señal rápida y sin Docker: restore (con auditoría NuGet de vulnerabilidades,
  # que rompe el build con severidad moderada o mayor), formato y pruebas unitarias.
  pruebas-unitarias:
    name: Formato, auditoría y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restaurar dependencias (lockfile + auditoría)
        run: dotnet restore --locked-mode

      - name: Verificar formato y estilo
        run: dotnet format --no-restore --verify-no-changes

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Pruebas unitarias
        run: dotnet test --project tests/NotesApi.UnitTests --no-build --configuration Release

  # Pruebas de integración: levantan MySQL con Testcontainers (Docker viene
  # preinstalado en los runners de ubuntu-latest).
  integracion:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restaurar dependencias
        run: dotnet restore --locked-mode

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Pruebas de integración
        run: dotnet test --project tests/NotesApi.Tests --no-build --configuration Release
