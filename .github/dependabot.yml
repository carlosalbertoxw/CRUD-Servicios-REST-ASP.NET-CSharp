version: 2
updates:
  # NuGet con Central Package Management: las versiones viven en Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly

  # Imágenes base de los Dockerfiles de la API y de las migraciones.
  - package-ecosystem: "docker"
    directories:
      - "/src/NotesApi"
      - "/src/NotesApi.Migrations"
    schedule:
      interval: weekly
