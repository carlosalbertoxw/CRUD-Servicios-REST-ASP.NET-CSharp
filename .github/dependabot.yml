version: 2
updates:
  # NuGet con Central Package Management: las versiones viven en Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly

  # Imágenes base de los Dockerfiles de la API y de las migraciones.
  - package-ecosystem: "docker"
    directories:
      - "/src/NotesApi"
      - "/src/NotesApi.Migrations"
    schedule:
      interval: weekly
    # Un salto de versión mayor de .NET (p. ej. 10 -> 11) exige migrar a la vez
    # global.json, el TargetFramework y las imágenes de runtime; se hace a mano.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
