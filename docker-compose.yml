services:
  mysql:
    image: mysql:8.4
    container_name: notes-mysql
    # Convención del proyecto: todas las fechas se guardan en UTC.
    command: --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: notes
      MYSQL_USER: notes_user
      MYSQL_PASSWORD: notes_password
    ports:
      - "3306:3306"
    volumes:
      - notes-mysql-data:/var/lib/mysql
      - ./db/init-users.sql:/docker-entrypoint-initdb.d/init-users.sql:ro
    healthcheck:
      # TCP (127.0.0.1) y no socket: el socket responde también durante el
      # servidor temporal de inicialización y daría "healthy" antes de tiempo.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Aplica el esquema (y datos de ejemplo con --seed) y termina. Usa notes_user,
  # que tiene privilegios de DDL; corre una sola vez cuando MySQL está sano.
  migrations:
    build:
      context: .
      dockerfile: src/NotesApi.Migrations/Dockerfile
    command: ["--seed"]
    environment:
      ConnectionStrings__NotesDb: "Server=mysql;Port=3306;Database=notes;User ID=notes_user;Password=notes_password"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # La API se conecta como notes_app (solo DML) y arranca cuando las
  # migraciones terminaron correctamente.
  api:
    build:
      context: .
      dockerfile: src/NotesApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotesDb: "Server=mysql;Port=3306;Database=notes;User ID=notes_app;Password=notes_app_password;Maximum Pool Size=20"
    depends_on:
      mysql:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  notes-mysql-data:
